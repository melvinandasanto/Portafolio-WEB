<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio personal de Melvin Adan Santos Claros: proyectos, habilidades y contacto." />
    <title>{{site_title}}</title>
  </head>
  <body>
    {{> Header}}
    <main>
      {{> Hero}}
      <section id="proyectos" class="projects">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow">Proyectos</p>
            <h2>Trabajos destacados</h2>
          </div>
          <div class="project-grid">
            {{#each projects}}
              {{> ProjectCard}}
            {{/each}}
          </div>
        </div>
      </section>
      {{> Contact}}
    </main>
    {{> Footer}}
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
